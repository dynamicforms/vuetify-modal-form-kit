name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test & build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ['lts/*', 'latest']

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Run tests
        run: npm test

      - name: Build library
        run: npm run build

      - name: Verify declaration output
        run: |
          size=$(wc -c < dist/index.d.ts)
          if [ "$size" -lt 10000 ]; then
            echo "::error::dist/index.d.ts is only $size bytes - declarations were rolled up empty"
            exit 1
          fi
          grep -q 'export declare class FormBuilder' dist/index.d.ts

      - name: Verify the built artifact
        run: npm run verify:artifact

      - name: Build docs
        run: npm run docs:build

      - name: Incremental coverage check
        uses: velis74/incremental-coverage-check@v3
        with:
          coverage-files: coverage/coverage-final.json
          # None of these carries a line a test could execute. docs/ holds the VitePress site and its demo
          # components and scripts/ the helpers CI itself runs, neither of them library code; a barrel re-exports
          # and is already outside vitest's coverage; and a module that declares types alone compiles to nothing.
          extra-ignore-patterns: |
            docs/**
            scripts/**
            **/index.ts
            src/layout/types.ts
            src/modal/df-modal.types.ts
          log-level: INFO
          base-ref: ${{ github.base_ref }}
          head-ref: HEAD
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
        # One report per pull request: the graded diff and the coverage file are the
        # same on both Node versions, so the second run would only repeat the first.
        if: github.event_name == 'pull_request' && matrix.node-version == 'lts/*'

  peer-range:
    name: Peer range (${{ matrix.edge }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        edge: [floor, latest]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js lts/*
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      # The lockfile pins what a developer resolved, which is what the job above needs and what leaves a peer
      # released afterwards to be met first by whoever runs `npm update`. This job resolves the declared ranges
      # afresh, at both ends, so that the promise `peerDependencies` makes is the one under test.
      - name: Resolve the ${{ matrix.edge }} of every declared peer range
        run: node scripts/install-peer-edge.mjs ${{ matrix.edge }}

      - name: Type-check
        run: npx vue-tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build library
        run: npm run build

      - name: Verify the built artifact
        run: npm run verify:artifact

  vue-floor:
    name: Type-check the emitted declarations against the lowest declared Vue
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js lts/*
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      # `peer-range (floor)` compiles the source against the lowest declared Vue; this compiles what the tarball
      # ships. `dist/index.d.ts` states Vue's own types, whose arity moves between Vue patch releases, so the
      # declarations can need a Vue newer than the range promises without any source file saying so.
      - name: Type-check dist/index.d.ts against the declared Vue floor
        run: node scripts/typecheck-dist-vue-floor.mjs

  node-floor:
    name: Load the artifact on the declared node floor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Read the declared node floor
        id: floor
        run: |
          floor=$(node -p "require('./package.json').engines.node.replace(/^[^0-9]*/, '')")
          echo "version=$floor" >> "$GITHUB_OUTPUT"
          echo "Declared floor: $floor"

      # `engines.node` is what a consumer may hold this package to, and both legs of the matrix above run well
      # above it.
      - name: Use Node.js ${{ steps.floor.outputs.version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.floor.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      # The artifact reaches this node through Vite, not through `require()`: it imports Vuetify's component
      # entries, each of which imports its own stylesheet, and the synchronous `require()` of an ES module
      # consults no loader hook that could answer for a `.css` file.
      - name: Verify the built artifact
        run: npm run verify:artifact
